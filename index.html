<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e7f7fb"><title>통영애 온나 | Project Gallery</title><style>
:root{--ink:#123c50;--sea:#0c9cba;--soft:#eff8fa}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f8fbfc}button{font:inherit}.hero{background:linear-gradient(112deg,#e6f9fc 0%,#a5e6f3 63%,#77cfe5 100%);padding:75px max(7vw,22px) 83px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-8%;bottom:-130px;width:65%;height:240px;border-radius:50%;border:42px solid #ffffff44;transform:rotate(-10deg);pointer-events:none}.wrap{max-width:1120px;margin:auto}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:800;color:#087d9d}.hero h1{font-size:clamp(42px,6.2vw,82px);line-height:1.12;letter-spacing:-.065em;margin:24px 0 20px;font-weight:850}.hero p{font-size:clamp(15px,1.5vw,19px);line-height:1.85;margin:0}.hero .chip{display:inline-block;background:#fff9;padding:10px 18px;border-radius:30px;font-size:12px;font-weight:700;margin-top:25px}.gallery{padding:72px 22px 110px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}.section-head h2{font-size:clamp(26px,3vw,38px);letter-spacing:-.055em;margin:10px 0}.section-head p{margin:0;color:#6b8490;font-size:14px}.count{font-size:13px;color:#678a98}.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.work{padding:0;border:1px solid #dbeaf0;border-radius:17px;overflow:hidden;background:white;text-align:left;cursor:pointer;box-shadow:0 9px 26px #164d6010;transition:transform .2s,box-shadow .2s}.work:hover{transform:translateY(-5px);box-shadow:0 14px 28px #164d6022}.preview{height:250px;background:#e8f3f6;display:flex;align-items:center;justify-content:center;padding:15px}.preview img{max-width:100%;max-height:100%;object-fit:contain}.work-info{padding:18px 20px 20px;display:flex;align-items:center;justify-content:space-between}.work-info small{display:block;color:#0a92ad;font-size:10px;font-weight:800;letter-spacing:1.3px;margin-bottom:7px}.work-info strong{font-size:18px}.plus{font-size:23px;color:#0a8baa}.foot{text-align:center;border-top:1px solid #dcebf0;padding:30px;color:#8096a1;font-size:12px}.modal{position:fixed;inset:0;z-index:50;background:#051c2beF;display:none;flex-direction:column;align-items:center;justify-content:center;padding:65px 58px 60px}.modal.show{display:flex}.modal img{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain;box-shadow:0 8px 40px #0004}.modal .stack{display:flex;gap:8px;align-items:center;justify-content:center;max-width:100%;height:100%;min-height:0}.modal .stack img{max-width:calc(50% - 5px)}.modal .stack img:only-child{max-width:100%}.modal button{border:0;background:#ffffff22;color:#fff;cursor:pointer;border-radius:50%;width:43px;height:43px;font-size:24px}.close{position:absolute;right:22px;top:20px}.prev,.next{position:absolute;top:50%;transform:translateY(-50%)}.prev{left:12px}.next{right:12px}.modal-label{color:#fff;text-align:center;position:absolute;bottom:18px;font-size:14px}.modal-label span{opacity:.6;margin-left:10px}.hint{font-size:12px;color:#9eb9c3;margin-top:5px}@media(max-width:800px){.works{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:58px 24px 66px}.preview{height:205px}}@media(max-width:540px){.works{grid-template-columns:1fr;gap:17px}.gallery{padding:50px 18px 70px}.preview{height:250px}.section-head{align-items:start}.hero h1{font-size:43px}.modal{padding:65px 42px 65px}.modal .stack{flex-direction:column}.modal .stack img{max-width:100%;max-height:43%}.modal .stack img:only-child{max-height:100%}.modal button{width:34px;height:34px}.prev{left:4px}.next{right:4px}}
</style></head><body><header class="hero"><div class="wrap"><div class="eyebrow">TONGYEONG · PROJECT GALLERY</div><h1>통영에서 한 달,<br>특별한 여행의 시작.</h1><p>푸른 바다와 다채로운 풍경을 담은<br>‘통영애 온나’ 한 달 살기 프로젝트 디자인 모음.</p><span class="chip">통영애 온나 · 캠페인 디자인</span></div></header><main class="gallery wrap"><div class="section-head"><div><div class="eyebrow">CAMPAIGN DESIGN</div><h2>프로젝트 작품 보기</h2><p>작품을 클릭하면 크게 볼 수 있습니다. 좌우 화살표로 다른 작품을 감상해 보세요.</p></div><span class="count">06 WORKS</span></div><div class="works"><button class="work" type="button" onclick="openGallery(0)" aria-label="리플릿 크게 보기"><span class="preview"><img loading="lazy" src="images/work01_1.jpg" alt="리플릿"></span><span class="work-info"><span><small>TRIFOLD LEAFLET</small><strong>리플릿</strong></span><span class="plus">↗</span></span></button>
<button class="work" type="button" onclick="openGallery(1)" aria-label="포스터 크게 보기"><span class="preview"><img loading="lazy" src="images/work02_1.jpg" alt="포스터"></span><span class="work-info"><span><small>POSTER</small><strong>포스터</strong></span><span class="plus">↗</span></span></button>
<button class="work" type="button" onclick="openGallery(2)" aria-label="사진형 X배너 크게 보기"><span class="preview"><img loading="lazy" src="images/work03_1.jpg" alt="사진형 X배너"></span><span class="work-info"><span><small>PHOTO X-BANNER</small><strong>사진형 X배너</strong></span><span class="plus">↗</span></span></button>
<button class="work" type="button" onclick="openGallery(3)" aria-label="일러스트형 X배너 크게 보기"><span class="preview"><img loading="lazy" src="images/work04_1.jpg" alt="일러스트형 X배너"></span><span class="work-info"><span><small>ILLUSTRATION X-BANNER</small><strong>일러스트형 X배너</strong></span><span class="plus">↗</span></span></button>
<button class="work" type="button" onclick="openGallery(4)" aria-label="사진형 웹배너 크게 보기"><span class="preview"><img loading="lazy" src="images/work05_1.jpg" alt="사진형 웹배너"></span><span class="work-info"><span><small>PHOTO WEB BANNER</small><strong>사진형 웹배너</strong></span><span class="plus">↗</span></span></button>
<button class="work" type="button" onclick="openGallery(5)" aria-label="일러스트형 웹배너 크게 보기"><span class="preview"><img loading="lazy" src="images/work06_1.jpg" alt="일러스트형 웹배너"></span><span class="work-info"><span><small>ILLUSTRATION WEB BANNER</small><strong>일러스트형 웹배너</strong></span><span class="plus">↗</span></span></button></div></main><footer class="foot">TONGYEONG AE ONNA · PROJECT GALLERY</footer><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="작품 확대 보기" onclick="if(event.target===this)closeGallery()"><button class="close" onclick="closeGallery()" aria-label="닫기">×</button><button class="prev" onclick="move(-1)" aria-label="이전 작품">‹</button><div id="viewer" class="stack"></div><button class="next" onclick="move(1)" aria-label="다음 작품">›</button><div class="modal-label"><b id="workTitle"></b><span id="counter"></span><div class="hint">ESC 닫기 · ← → 이동</div></div></div><script>const works=[{"title": "리플릿", "images": ["images/work01_1.jpg", "images/work01_2.jpg"]}, {"title": "포스터", "images": ["images/work02_1.jpg"]}, {"title": "사진형 X배너", "images": ["images/work03_1.jpg"]}, {"title": "일러스트형 X배너", "images": ["images/work04_1.jpg"]}, {"title": "사진형 웹배너", "images": ["images/work05_1.jpg"]}, {"title": "일러스트형 웹배너", "images": ["images/work06_1.jpg"]}];let current=0;const modal=document.getElementById('modal');function openGallery(i){current=i;render();modal.classList.add('show');document.body.style.overflow='hidden'}function closeGallery(){modal.classList.remove('show');document.body.style.overflow=''}function move(n){current=(current+n+works.length)%works.length;render()}function render(){const w=works[current],v=document.getElementById('viewer');v.replaceChildren();for(const src of w.images){const img=document.createElement('img');img.src=src;img.alt=w.title;v.append(img)}document.getElementById('workTitle').textContent=w.title;document.getElementById('counter').textContent=`${current+1} / ${works.length}`}document.addEventListener('keydown',e=>{if(!modal.classList.contains('show'))return;if(e.key==='Escape')closeGallery();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});</script></body></html>
